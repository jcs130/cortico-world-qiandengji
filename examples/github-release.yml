# Builds only this repository's owned sources. No framework checkout or patch application.
name: Build independent Minecraft client
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and verify
        run: |
          pnpm build
          pnpm typecheck
          pnpm exec tsc --noEmit -p tsconfig.integration.json
          pnpm test
          pnpm pack
      - uses: actions/upload-artifact@v4
        with:
          name: independent-minecraft-package
          path: agent-mc-world-*.tgz
